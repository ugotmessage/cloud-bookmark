<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cloud Bookmark v2</title><style>
:root{--bg:#faf8f4;--panel:#fffdfa;--soft:#f2eee7;--line:#e5dfd6;--text:#211f1b;--muted:#7c766d;--accent:#a63b32;--accent2:#f3e2de;--danger:#b84039}html[data-theme=dark]{--bg:#171715;--panel:#1f1f1c;--soft:#292720;--line:#38352e;--text:#eee9e1;--muted:#9b958a;--accent:#cd594d;--accent2:#3b2421;--danger:#e56a61}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}button,input{font:inherit;color:inherit}.mobile{min-height:100vh;padding-bottom:92px}.mhead{position:sticky;top:0;z-index:10;padding:14px 14px 12px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.brandrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.brandrow h1{font:700 23px Georgia,"Noto Serif TC",serif;margin:0}.icon{width:35px;height:35px;border:0;border-radius:8px;background:transparent;cursor:pointer}.icon:hover{background:var(--soft)}.search{display:flex;align-items:center;gap:8px;height:42px;padding:0 11px;background:var(--soft);border:1px solid transparent;border-radius:9px}.search:focus-within{background:var(--panel);border-color:var(--accent)}.search input{width:100%;border:0;outline:0;background:transparent;font-size:14px}.main{padding:12px}.label{display:flex;justify-content:space-between;align-items:center;padding:17px 5px 8px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.linkbtn{border:0;background:transparent;color:var(--accent);cursor:pointer;font-size:12px}.folder{margin-bottom:9px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.folderhead{width:100%;display:flex;align-items:center;justify-content:space-between;border:0;background:transparent;padding:13px;cursor:pointer;text-align:left}.folderhead:hover{background:var(--soft)}.fmain{display:flex;align-items:center;gap:10px}.ficon{width:31px;height:31px;display:grid;place-items:center;background:var(--soft);border-radius:8px;color:var(--muted)}.fav .ficon{background:var(--accent2);color:var(--accent)}.ftxt b{display:block;font-size:14px}.ftxt small{display:block;margin-top:2px;color:var(--muted);font-size:11px}.fside{display:flex;align-items:center;gap:8px;color:var(--muted)}.count{min-width:24px;height:22px;padding:0 7px;display:inline-grid;place-items:center;border-radius:999px;background:var(--soft);font-size:11px}.chev{transition:.16s}.folderhead[aria-expanded=false] .chev{transform:rotate(-90deg)}.body{border-top:1px solid var(--line)}.body.hide{display:none}.row{position:relative;display:flex;align-items:center;gap:10px;min-height:58px;padding:9px 9px 9px 12px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row:hover{background:color-mix(in srgb,var(--soft) 60%,transparent)}.open{position:absolute;inset:0 74px 0 0;border:0;background:transparent;cursor:pointer}.favico{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--soft);font-size:16px}.copy{min-width:0;flex:1}.title{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.domain{margin-top:2px;color:var(--muted);font:11px ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{position:relative;z-index:2;display:flex}.small{width:31px;height:31px;border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer}.small:hover{background:var(--soft);color:var(--text)}.small.on{color:var(--accent)}.fab{position:fixed;z-index:20;right:18px;bottom:20px;width:54px;height:54px;border:0;border-radius:50%;background:var(--accent);color:white;font-size:26px;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 35%,transparent);cursor:pointer}.empty{padding:28px;text-align:center;color:var(--muted);font-size:12px}.desk{display:none}.modalbg{position:fixed;inset:0;z-index:40;background:#0005}.modal{position:fixed;z-index:50;left:0;right:0;bottom:0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));background:var(--panel);border-radius:18px 18px 0 0}.modal h2{margin:0 0 14px;font-size:18px}.field{display:grid;gap:5px;margin:10px 0}.field span{color:var(--muted);font-size:11px;font-weight:650}.field input{height:42px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 10px;outline:0}.field input:focus{border-color:var(--accent)}.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.btn{height:38px;padding:0 14px;border-radius:8px;cursor:pointer}.ghost{border:1px solid var(--line);background:var(--panel)}.primary{border:1px solid var(--accent);background:var(--accent);color:white}.menu{position:fixed;z-index:60;width:185px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 14px 36px #0002}.menu button{width:100%;border:0;background:transparent;border-radius:6px;padding:9px;text-align:left;font-size:12px;cursor:pointer}.menu button:hover{background:var(--soft)}.menu .danger{color:var(--danger)}.hidden{display:none!important}
@media(min-width:900px){body{overflow:hidden}.mobile{display:none}.desk{display:flex;height:100vh}.side{width:236px;display:flex;flex-direction:column;padding:18px 13px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--bg) 90%,var(--panel))}.logo{display:flex;gap:10px;align-items:center;padding:0 7px 17px}.mark{width:31px;height:31px;display:grid;place-items:center;border-radius:8px;background:var(--accent);color:white;font:bold 16px Georgia}.logo b{display:block;font:700 14px Georgia,"Noto Serif TC",serif}.logo small{color:var(--muted);font-size:10px}.dsearch{height:38px;margin-bottom:14px}.nav,.folders{display:grid;gap:2px}.nav button,.folders button{height:34px;display:grid;grid-template-columns:22px 1fr auto;align-items:center;border:0;border-radius:7px;background:transparent;padding:0 8px;text-align:left;color:var(--muted);font-size:12px;cursor:pointer}.nav button b,.folders button b{color:var(--text);font-weight:550}.nav button em,.folders button em{font-style:normal;font-size:10px;color:var(--muted)}.nav button:hover,.folders button:hover{background:var(--soft)}.nav button.active,.folders button.active{background:var(--accent2);color:var(--accent)}.nav button.active b,.nav button.active em,.folders button.active b,.folders button.active em{color:var(--accent)}.slabel{display:flex;justify-content:space-between;align-items:center;margin:17px 7px 6px;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.foot{margin-top:auto;display:grid;gap:2px;padding-top:10px;border-top:1px solid var(--line)}.foot button{border:0;background:transparent;padding:8px;border-radius:7px;text-align:left;color:var(--muted);font-size:11px;cursor:pointer}.foot button:hover{background:var(--soft);color:var(--text)}.dmain{min-width:0;flex:1;display:flex;flex-direction:column;background:var(--panel)}.top{height:76px;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line)}.top small{display:block;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.12em}.top h1{margin:2px 0 0;font:700 20px Georgia,"Noto Serif TC",serif}.topright{display:flex;gap:9px;align-items:center}.toggle{display:flex}.toggle button{width:34px;height:34px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}.toggle button:first-child{border-radius:7px 0 0 7px}.toggle button:last-child{border-left:0;border-radius:0 7px 7px 0}.toggle button.active{background:var(--text);color:var(--bg);border-color:var(--text)}.content{flex:1;overflow:auto;padding:20px 24px 40px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:11px}.card{position:relative;min-height:108px;padding:13px;border:1px solid var(--line);border-radius:10px}.card:hover{box-shadow:0 4px 15px #0001}.card .open{inset:0}.ctop{display:flex;gap:10px}.cacts{position:absolute;right:7px;top:7px;z-index:2;opacity:0}.card:hover .cacts{opacity:1}.cfolder{position:absolute;left:13px;bottom:12px;color:var(--muted);font-size:10px}.list{border-top:1px solid var(--line)}.list .row{min-height:52px}.modal{left:50%;right:auto;top:50%;bottom:auto;width:440px;transform:translate(-50%,-50%);border:1px solid var(--line);border-radius:13px}.menu{box-shadow:0 16px 40px #0004}}
</style></head><body>
<section class="mobile"><header class="mhead"><div class="brandrow"><h1>書籤</h1><button class="icon" data-theme>☾</button></div><label class="search">⌕<input id="ms" placeholder="搜尋書籤、網址或資料夾…"></label></header><main class="main"><div id="msearch" class="hidden"></div><div id="mbrowse"><section id="mfav" class="folder fav"></section><div class="label"><span>資料夾</span><button class="linkbtn" data-newfolder>＋ 新增</button></div><div id="mfolders"></div></div></main><button class="fab" data-add>＋</button></section>
<section class="desk"><aside class="side"><div class="logo"><div class="mark">B</div><div><b>Cloud Bookmark</b><small>Personal library</small></div></div><label class="search dsearch">⌕<input id="ds" placeholder="搜尋"><small>⌘K</small></label><nav id="nav" class="nav"></nav><div class="slabel"><span>資料夾</span><button class="icon" data-newfolder>＋</button></div><nav id="dfolders" class="folders"></nav><div class="foot"><button data-theme>◐ 切換主題</button></div></aside><main class="dmain"><header class="top"><div><small id="deye">LIBRARY</small><h1 id="dtitle">全部書籤</h1></div><div class="topright"><div class="toggle"><button data-layout="grid" class="active">▦</button><button data-layout="list">☷</button></div><button class="btn primary" data-add>＋ 新增書籤</button></div></header><section id="content" class="content"></section></main></section>
<div id="bg" class="modalbg hidden"></div><section id="modal" class="modal hidden"><h2 id="mtitle">新增書籤</h2><input id="mid" type="hidden"><label class="field"><span>網址</span><input id="url" type="url" placeholder="https://example.com"></label><label class="field"><span>名稱</span><input id="name" placeholder="書籤名稱"></label><label class="field"><span>資料夾</span><input id="folder" list="folderlist" placeholder="資料夾"></label><datalist id="folderlist"></datalist><div class="mact"><button class="btn ghost" data-close>取消</button><button class="btn primary" id="save">儲存</button></div></section><div id="menu" class="menu hidden"></div>
<script>
const KEY='cb-v2-proto';let S=JSON.parse(localStorage.getItem(KEY)||'null')||{folders:['股票','AI','工作','Server','未分類'],bookmarks:[['Wantgoo 玩股網','https://www.wantgoo.com/','股票',1],['Goodinfo! 台灣股市資訊網','https://goodinfo.tw/','股票',1],['XQ 全球贏家','https://www.xq.com.tw/','股票',0],['TradingView','https://www.tradingview.com/','股票',0],['ChatGPT','https://chatgpt.com/','AI',1],['Claude','https://claude.ai/','AI',0],['Gemini','https://gemini.google.com/','AI',0],['GitHub','https://github.com/','工作',1],['Notion','https://www.notion.so/','工作',0],['Cloudflare Dashboard','https://dash.cloudflare.com/','Server',1],['Synology','https://www.synology.com/','Server',0],['Example','https://example.com/','未分類',0]].map((x,i)=>({id:'b'+i,name:x[0],url:x[1],folder:x[2],favorite:!!x[3],recent:0}))};let view='all',layout='grid',menuId=null,expanded=JSON.parse(localStorage.getItem('cb-exp')||'{}');const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],domain=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch{return u}},save=()=>localStorage.setItem(KEY,JSON.stringify(S)),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rows(a,showFolder=false){if(!a.length)return'<div class="empty">這裡還沒有書籤</div>';return a.map(b=>`<div class="row"><button class="open" data-open="${b.id}"></button><span class="favico">◈</span><div class="copy"><div class="title">${esc(b.name)}</div><div class="domain">${esc(domain(b.url))}${showFolder?' · '+esc(b.folder):''}</div></div><div class="actions"><button class="small ${b.favorite?'on':''}" data-star="${b.id}">${b.favorite?'★':'☆'}</button><button class="small" data-menu="${b.id}">⋯</button></div></div>`).join('')}
function folder(name,a,isFav=false){let open=isFav?(expanded.fav??true):(expanded[name]??(name==='股票'||name==='Server'));return`<section class="folder ${isFav?'fav':''}"><button class="folderhead" data-fold="${esc(isFav?'__fav':name)}" aria-expanded="${open}"><span class="fmain"><span class="ficon">${isFav?'★':'▱'}</span><span class="ftxt"><b>${esc(name)}</b><small>${isFav?'最常開啟的連結':'點選連結即可開啟'}</small></span></span><span class="fside"><span class="count">${a.length}</span><span class="chev">⌄</span></span></button><div class="body ${open?'':'hide'}">${rows(a)}</div></section>`}
function render(){let fav=S.bookmarks.filter(b=>b.favorite);$('#mfav').outerHTML=folder('常用',fav,true).replace('<section class="folder fav"','<section id="mfav" class="folder fav"');$('#mfolders').innerHTML=S.folders.map(f=>folder(f,S.bookmarks.filter(b=>b.folder===f))).join('');$('#folderlist').innerHTML=S.folders.map(f=>`<option value="${esc(f)}">`).join('');renderNav();renderDesk();searchMobile()}
function renderNav(){let nav=[['all','▦','全部書籤',S.bookmarks.length],['favorites','★','常用',S.bookmarks.filter(b=>b.favorite).length],['recent','◷','最近',S.bookmarks.filter(b=>b.recent).length],['unsorted','□','未分類',S.bookmarks.filter(b=>b.folder==='未分類').length]];$('#nav').innerHTML=nav.map(x=>`<button data-view="${x[0]}" class="${view===x[0]?'active':''}"><span>${x[1]}</span><b>${x[2]}</b><em>${x[3]}</em></button>`).join('');$('#dfolders').innerHTML=S.folders.filter(f=>f!=='未分類').map(f=>`<button data-view="folder:${esc(f)}" class="${view==='folder:'+f?'active':''}"><span>▱</span><b>${esc(f)}</b><em>${S.bookmarks.filter(b=>b.folder===f).length}</em></button>`).join('')}
function items(){let a=[...S.bookmarks];if(view==='favorites')a=a.filter(b=>b.favorite);if(view==='recent')a=a.filter(b=>b.recent).sort((a,b)=>b.recent-a.recent);if(view==='unsorted')a=a.filter(b=>b.folder==='未分類');if(view.startsWith('folder:'))a=a.filter(b=>b.folder===view.slice(7));let q=$('#ds').value.trim().toLowerCase();if(q)a=a.filter(b=>[b.name,b.url,b.folder,domain(b.url)].some(v=>v.toLowerCase().includes(q)));return a}
function renderDesk(){let a=items(),meta=view==='all'?['LIBRARY','全部書籤']:view==='favorites'?['QUICK ACCESS','常用']:view==='recent'?['HISTORY','最近']:view==='unsorted'?['INBOX','未分類']:['FOLDER',view.slice(7)];$('#deye').textContent=meta[0];$('#dtitle').textContent=meta[1]+'  '+a.length;if(layout==='list'){$('#content').innerHTML=`<div class="list">${rows(a,view==='all')}</div>`;return}$('#content').innerHTML=`<div class="grid">${a.map(b=>`<article class="card"><button class="open" data-open="${b.id}"></button><div class="ctop"><span class="favico">◈</span><div class="copy"><div class="title">${esc(b.name)}</div><div class="domain">${esc(domain(b.url))}</div></div></div><div class="cacts"><button class="small ${b.favorite?'on':''}" data-star="${b.id}">${b.favorite?'★':'☆'}</button><button class="small" data-menu="${b.id}">⋯</button></div><div class="cfolder">${esc(b.folder)}</div></article>`).join('')}</div>`}
function searchMobile(){let q=$('#ms').value.trim().toLowerCase();if(!q){$('#msearch').classList.add('hidden');$('#mbrowse').classList.remove('hidden');return}let a=S.bookmarks.filter(b=>[b.name,b.url,b.folder,domain(b.url)].some(v=>v.toLowerCase().includes(q)));$('#mbrowse').classList.add('hidden');$('#msearch').classList.remove('hidden');$('#msearch').innerHTML=`<div class="label"><span>搜尋結果</span><span>${a.length}</span></div><section class="folder"><div class="body">${rows(a,true)}</div></section>`}
function openModal(b){$('#mtitle').textContent=b?'編輯書籤':'新增書籤';$('#mid').value=b?.id||'';$('#url').value=b?.url||'';$('#name').value=b?.name||'';$('#folder').value=b?.folder||S.folders[0]||'未分類';$('#bg').classList.remove('hidden');$('#modal').classList.remove('hidden');setTimeout(()=>$('#url').focus(),30)}function closeModal(){$('#bg').classList.add('hidden');$('#modal').classList.add('hidden')}
function openMenu(id,el){menuId=id;let b=S.bookmarks.find(x=>x.id===id),m=$('#menu');m.innerHTML=`<button data-act="edit">編輯</button><button data-act="move">移動到…</button><button data-act="fav">${b.favorite?'移出常用':'加入常用'}</button><button class="danger" data-act="del">刪除</button>`;m.classList.remove('hidden');let r=el.getBoundingClientRect();m.style.left=Math.min(innerWidth-195,Math.max(8,r.right-185))+'px';m.style.top=Math.min(innerHeight-170,r.bottom+5)+'px'}
function theme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.setItem('cb-theme',document.documentElement.dataset.theme)}document.documentElement.dataset.theme=localStorage.getItem('cb-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
document.addEventListener('click',e=>{let t=e.target.closest('[data-theme],[data-add],[data-newfolder],[data-close],[data-fold],[data-open],[data-star],[data-menu],[data-view],[data-layout],[data-act]');if(!t){if(!e.target.closest('#menu'))$('#menu').classList.add('hidden');return}if(t.hasAttribute('data-theme'))theme();if(t.hasAttribute('data-add'))openModal();if(t.hasAttribute('data-close'))closeModal();if(t.hasAttribute('data-newfolder')){let f=prompt('新資料夾名稱');if(f&&!S.folders.includes(f)){S.folders.splice(Math.max(0,S.folders.length-1),0,f.trim());save();render()}}if(t.hasAttribute('data-fold')){let f=t.dataset.fold,key=f==='__fav'?'fav':f,v=t.getAttribute('aria-expanded')==='true';expanded[key]=!v;localStorage.setItem('cb-exp',JSON.stringify(expanded));t.setAttribute('aria-expanded',!v);t.nextElementSibling.classList.toggle('hide',v)}if(t.hasAttribute('data-open')){let b=S.bookmarks.find(x=>x.id===t.dataset.open);b.recent=Date.now();save();window.open(b.url,'_blank','noopener,noreferrer')}if(t.hasAttribute('data-star')){e.stopPropagation();let b=S.bookmarks.find(x=>x.id===t.dataset.star);b.favorite=!b.favorite;save();render()}if(t.hasAttribute('data-menu')){e.stopPropagation();openMenu(t.dataset.menu,t)}if(t.hasAttribute('data-view')){view=t.dataset.view;$('#ds').value='';renderNav();renderDesk()}if(t.hasAttribute('data-layout')){layout=t.dataset.layout;$$('[data-layout]').forEach(x=>x.classList.toggle('active',x.dataset.layout===layout));renderDesk()}if(t.hasAttribute('data-act')){let b=S.bookmarks.find(x=>x.id===menuId),a=t.dataset.act;if(a==='edit')openModal(b);if(a==='fav'){b.favorite=!b.favorite;save();render()}if(a==='move'){let f=prompt('移動到哪個資料夾？\n'+S.folders.join(' / '),b.folder);if(f&&S.folders.includes(f)){b.folder=f;save();render()}}if(a==='del'&&confirm('刪除「'+b.name+'」？')){S.bookmarks=S.bookmarks.filter(x=>x.id!==b.id);save();render()}$('#menu').classList.add('hidden')}});$('#save').onclick=()=>{let id=$('#mid').value,b={name:$('#name').value.trim(),url:$('#url').value.trim(),folder:$('#folder').value.trim()||'未分類'};if(!b.name||!b.url)return;if(!S.folders.includes(b.folder))S.folders.splice(Math.max(0,S.folders.length-1),0,b.folder);if(id){Object.assign(S.bookmarks.find(x=>x.id===id),b)}else S.bookmarks.unshift({id:'b'+Date.now(),favorite:false,recent:0,...b});save();closeModal();render()};$('#ms').oninput=searchMobile;$('#ds').oninput=renderDesk;document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();(matchMedia('(min-width:900px)').matches?$('#ds'):$('#ms')).focus()}if(e.key==='Escape'){closeModal();$('#menu').classList.add('hidden')}});render();
</script></body></html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雲端書籤</title>
<style>
:root{--bg:#fff;--bg2:#f5f5f4;--bd:#e7e5e4;--tx:#1c1917;--tx2:#78716c;--ac:#b42318;--acbg:#fde8e6;--r:12px}
@media(prefers-color-scheme:dark){:root{--bg:#1c1917;--bg2:#292524;--bd:#3f3b38;--tx:#f5f5f4;--tx2:#a8a29e;--acbg:#4a1d19}}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;width:100%}
.ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.star{color:var(--tx2);font-size:16px}.star.on{color:#f59e0b}
.search{display:flex;gap:8px;align-items:center;background:var(--bg2);border-radius:10px;padding:0 12px}
.search input{border:0;background:none;padding:10px 0}
.btn{background:var(--ac);color:#fff;border-radius:8px;padding:9px 16px;font-weight:600}
.empty{color:var(--tx2);padding:24px;text-align:center}

/* ---------- Mobile ---------- */
.m{display:block;max-width:480px;margin:0 auto;min-height:100vh;padding:16px 16px 90px}
.d{display:none}
.m header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.m h1{font-size:20px}
.fav-row{display:flex;gap:8px;overflow-x:auto;padding:8px 0 14px}
.chip{flex:none;width:76px;border:1px solid var(--bd);border-radius:10px;padding:8px 4px;text-align:center;font-size:11px}
.chip .ico{margin:0 auto 4px}.chip small{display:block;color:var(--tx2);font-size:9px;overflow:hidden;text-overflow:ellipsis}
.sec{margin-top:8px;font-weight:600;color:var(--tx2);display:flex;gap:6px;align-items:center;padding:6px 0}
.fold{display:flex;align-items:center;gap:10px;width:100%;padding:14px 4px;border-top:1px solid var(--bd);font-weight:600;text-align:left}
.fold .n{margin-left:auto;color:var(--tx2);font-weight:400}.fold .ch{transition:.2s;color:var(--tx2)}
.fold.open .ch{transform:rotate(90deg)}
.row{display:flex;gap:12px;align-items:center;padding:8px 4px}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:600}.row .t small{color:var(--tx2)}
.fab{position:fixed;right:max(20px,calc(50% - 220px));bottom:24px;width:52px;height:52px;border-radius:50%;background:var(--ac);color:#fff;font-size:28px;box-shadow:0 4px 12px #0004}

/* ---------- Desktop ---------- */
@media(min-width:768px){
 .m{display:none}.fab{display:none}
 .d{display:flex;height:100vh}
 .side{width:240px;background:var(--bg2);border-right:1px solid var(--bd);padding:20px 12px;overflow-y:auto;flex:none}
 .side h1{font-size:18px;padding:0 8px 14px}
 .nav{display:flex;width:100%;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;text-align:left}
 .nav:hover{background:var(--bd)}.nav.act{background:var(--acbg);color:var(--ac);font-weight:600}
 .nav .n{margin-left:auto;color:var(--tx2);font-size:12px}
 .lbl{font-size:12px;color:var(--tx2);padding:16px 10px 6px;display:flex;justify-content:space-between}
 .main{flex:1;padding:24px 32px;overflow-y:auto}
 .bar{display:flex;align-items:center;gap:10px;margin-bottom:20px}
 .bar h2{font-size:22px}.bar small{color:var(--tx2);display:block;font-size:13px}.bar .sp{flex:1}
 .seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
 .seg button{padding:7px 12px}.seg .on{background:var(--bg2);font-weight:700}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
 .card{border:1px solid var(--bd);border-radius:var(--r);padding:16px;position:relative;display:flex;flex-direction:column;gap:12px;min-height:128px;transition:.15s}
 .card:hover{box-shadow:0 4px 14px #0002;transform:translateY(-2px)}
 .card .star{position:absolute;top:12px;right:12px}
 .card b{display:block}.card small{color:var(--tx2)}
 .card .ico{width:40px;height:40px;font-size:18px}
 table{width:100%;border-collapse:collapse}
 th{text-align:left;color:var(--tx2);font-weight:500;padding:8px;border-bottom:1px solid var(--bd);font-size:12px}
 td{padding:12px 8px;border-bottom:1px solid var(--bd)}
 td .ico{display:inline-grid;vertical-align:middle;margin-right:8px;width:26px;height:26px;font-size:12px}
}

/* ---------- Add sheet ---------- */
.mask{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:9}
.mask.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:16px 20px 24px;display:flex;flex-direction:column;gap:12px}
.sheet .grip{width:40px;height:4px;background:var(--bd);border-radius:2px;margin:0 auto}
.sheet .hd{display:flex;justify-content:space-between;font-weight:700;font-size:16px}
.sheet label{font-size:12px;color:var(--tx2);display:block;margin-bottom:4px}
.tg{display:flex;justify-content:space-between;align-items:center}
.sw{width:46px;height:26px;border-radius:13px;background:var(--bd);position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
.sw.on{background:var(--ac)}.sw.on::after{left:23px}
@media(min-width:768px){.mask{align-items:center}.sheet{border-radius:16px;max-width:420px}.sheet .grip{display:none}}
</style>
</head>
<body>

<!-- Mobile -->
<div class="m" id="m"></div>
<button class="fab" onclick="openSheet()">＋</button>

<!-- Desktop -->
<div class="d">
  <aside class="side">
    <h1>雲端書籤</h1>
    <div class="search" style="margin:0 4px 12px"><span>🔍</span><input id="dq" placeholder="搜尋書籤…" oninput="setQ(this.value)"></div>
    <div id="dnav"></div>
    <div class="lbl">資料夾 <button onclick="addFolder()">＋</button></div>
    <div id="dfold"></div>
    <div class="lbl"></div>
    <button class="nav" onclick="exportJSON()">⇅ 匯入 / 匯出</button>
  </aside>
  <main class="main">
    <div class="bar">
      <div><h2 id="dtitle"></h2><small id="dcount"></small></div>
      <span class="sp"></span>
      <div class="seg"><button id="vl" onclick="setView('list')">☰</button><button id="vg" onclick="setView('grid')">▦</button></div>
      <button class="btn" onclick="openSheet()">＋ 新增書籤</button>
    </div>
    <div id="dcontent"></div>
  </main>
</div>

<!-- Add Bookmark (Bottom Sheet) -->
<div class="mask" id="mask" onclick="if(event.target===this)closeSheet()">
  <div class="sheet">
    <div class="grip"></div>
    <div class="hd"><span>新增書籤</span><button style="font-weight:400;color:var(--tx2)" onclick="closeSheet()">取消</button></div>
    <div><label>網址</label><input id="fu" placeholder="https://" oninput="autoTitle()"></div>
    <div><label>標題</label><input id="ft" placeholder="自動抓取標題"></div>
    <div><label>資料夾</label><select id="ff"></select></div>
    <div class="tg"><span>加入我的最愛</span><button class="sw" id="fs" onclick="this.classList.toggle('on')"></button></div>
    <button class="btn" style="padding:13px" onclick="save()">儲存</button>
  </div>
</div>

<script>
const COLORS=['#10a37f','#24292f','#d9593b','#4a6fd8','#7c3aed','#f59e0b','#0891b2','#be185d'];
const colorOf=s=>COLORS[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
let S={
  folders:['股票','AI','工作','Server','工具','閱讀清單','設計參考','旅遊'],
  marks:[
    {n:'ChatGPT',u:'chatgpt.com',f:'AI',fav:1,d:'2024/06/01'},
    {n:'GitHub',u:'github.com',f:'AI',fav:1,d:'2024/06/01'},
    {n:'Claude',u:'claude.ai',f:'AI',fav:0,d:'2024/05/28'},
    {n:'Gemini',u:'gemini.google.com',f:'AI',fav:0,d:'2024/05/27'},
    {n:'OpenAI',u:'openai.com',f:'AI',fav:0,d:'2024/05/26'},
    {n:'Hugging Face',u:'huggingface.co',f:'AI',fav:0,d:'2024/05/25'},
    {n:'Perplexity',u:'perplexity.ai',f:'AI',fav:0,d:'2024/05/24'},
    {n:'Notion AI',u:'notion.so',f:'AI',fav:0,d:'2024/05/23'},
    {n:'XQ',u:'xq.com.tw',f:'股票',fav:1,d:'2024/05/20'},
    {n:'NAS',u:'192.168.1.10',f:'Server',fav:1,d:'2024/05/18'},
    {n:'Cloudflare Docs',u:'developers.cloudflare.com',f:'工具',fav:0,d:'2024/05/10'},
    {n:'Dribbble',u:'dribbble.com',f:'設計參考',fav:0,d:'2024/05/02'}
  ],
  open:new Set(['AI']), cur:'all', view:'grid', q:''
};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const icon=m=>`<span class="ico" style="background:${colorOf(m.n)}">${esc(m.n[0].toUpperCase())}</span>`;
const hit=m=>!S.q||(m.n+m.u).toLowerCase().includes(S.q.toLowerCase());
const inF=f=>S.marks.filter(m=>m.f===f&&hit(m));
const go=u=>window.open('https://'+u.replace(/^https?:\/\//,''),'_blank','noopener');
function fav(i){S.marks[i].fav^=1;render()}
function setQ(v){S.q=v;render()}
function setView(v){S.view=v;render()}
function setCur(c){S.cur=c;render()}
function toggle(f){S.open.has(f)?S.open.delete(f):S.open.add(f);render()}

function renderMobile(){
  const favs=S.marks.filter(m=>m.fav&&hit(m));
  let h=`<header><h1>雲端書籤</h1><span>🔍 ⋮</span></header>
  <div class="search"><span>🔍</span><input placeholder="搜尋書籤…" value="${esc(S.q)}" oninput="setQ(this.value)"></div>
  <div class="sec"><span style="color:#f59e0b">★</span> 我的最愛</div>
  <div class="fav-row">${favs.map(m=>`<button class="chip" onclick="go('${m.u}')">${icon(m)}${esc(m.n)}<small>${esc(m.u)}</small></button>`).join('')||'<span class="empty">尚無最愛</span>'}</div>`;
  S.folders.forEach(f=>{
    const list=inF(f),open=S.open.has(f);
    h+=`<button class="fold ${open?'open':''}" onclick="toggle('${f}')">📁 ${esc(f)}<span class="n">${list.length}</span><span class="ch">›</span></button>`;
    if(open)h+=list.map(m=>{const i=S.marks.indexOf(m);return `<div class="row">${icon(m)}<div class="t" onclick="go('${m.u}')"><b>${esc(m.n)}</b><small>${esc(m.u)}</small></div><button class="star ${m.fav?'on':''}" onclick="fav(${i})">${m.fav?'★':'☆'}</button><button class="star">⋯</button></div>`}).join('')||'<div class="empty">空資料夾</div>';
  });
  $('m').innerHTML=h;
}

function renderDesktop(){
  const cnt=f=>S.marks.filter(m=>m.f===f).length;
  const nav=(k,l,n,ic)=>`<button class="nav ${S.cur===k?'act':''}" onclick="setCur('${k}')">${ic} ${l}<span class="n">${n}</span></button>`;
  $('dnav').innerHTML=nav('all','全部書籤',S.marks.length,'🔖')+nav('fav','我的最愛',S.marks.filter(m=>m.fav).length,'☆')+nav('recent','最近開啟',Math.min(5,S.marks.length),'🕘')+nav('none','未分類',S.marks.filter(m=>!m.f).length,'📁');
  $('dfold').innerHTML=S.folders.map(f=>nav('f:'+f,esc(f),cnt(f),'📁')).join('');
  let list=S.marks.filter(hit),title='全部書籤';
  if(S.cur==='fav'){list=list.filter(m=>m.fav);title='我的最愛'}
  else if(S.cur==='recent'){list=list.slice(0,5);title='最近開啟'}
  else if(S.cur==='none'){list=list.filter(m=>!m.f);title='未分類'}
  else if(S.cur.startsWith('f:')){title=S.cur.slice(2);list=list.filter(m=>m.f===title)}
  $('dtitle').textContent=title;$('dcount').textContent=list.length+' 個書籤';
  $('vl').className=S.view==='list'?'on':'';$('vg').className=S.view==='grid'?'on':'';
  if(!list.length){$('dcontent').innerHTML='<div class="empty">沒有符合的書籤</div>';return}
  $('dcontent').innerHTML=S.view==='grid'
   ?`<div class="grid">${list.map(m=>{const i=S.marks.indexOf(m);return `<div class="card" onclick="go('${m.u}')"><button class="star ${m.fav?'on':''}" onclick="event.stopPropagation();fav(${i})">${m.fav?'★':'☆'}</button>${icon(m)}<div><b>${esc(m.n)}</b><small>${esc(m.u)}</small></div></div>`}).join('')}</div>`
   :`<table><tr><th>名稱</th><th>網址</th><th>資料夾</th><th>加入日期</th></tr>${list.map(m=>`<tr style="cursor:pointer" onclick="go('${m.u}')"><td>${icon(m)}${esc(m.n)}</td><td>${esc(m.u)}</td><td>${esc(m.f||'-')}</td><td>${m.d}</td></tr>`).join('')}</table>`;
}

function render(){renderMobile();renderDesktop()}
function openSheet(){
  $('ff').innerHTML=S.folders.map(f=>`<option>${esc(f)}</option>`).join('');
  if(S.cur.startsWith('f:'))$('ff').value=S.cur.slice(2);
  $('fu').value='';$('ft').value='';$('fs').classList.remove('on');
  $('mask').classList.add('show');$('fu').focus();
}
function closeSheet(){$('mask').classList.remove('show')}
function autoTitle(){ // 示範：以網域推測標題（實際抓取需後端 / Worker 代理）
  try{const h=new URL($('fu').value.startsWith('http')?$('fu').value:'https://'+$('fu').value).hostname.replace(/^www\./,'');
  const p=h.split('.');$('ft').value=p.length>2?p.slice(0,-1).map(s=>s[0].toUpperCase()+s.slice(1)).join(' '):p[0][0].toUpperCase()+p[0].slice(1)}catch(e){}
}
function save(){
  const u=$('fu').value.trim().replace(/^https?:\/\//,'');if(!u)return;
  S.marks.unshift({n:$('ft').value.trim()||u,u,f:$('ff').value,fav:$('fs').classList.contains('on')?1:0,d:new Date().toLocaleDateString('zh-TW')});
  S.open.add($('ff').value);closeSheet();render();
}
function addFolder(){const n=prompt('新資料夾名稱');if(n&&!S.folders.includes(n)){S.folders.push(n);render()}}
function exportJSON(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({folders:S.folders,marks:S.marks},null,2)],{type:'application/json'}));
  a.download='bookmarks.json';a.click();
}
render();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>雲端書籤</title>
  <link rel="stylesheet" href="themes-v2.css">
  <link rel="stylesheet" href="mobile-v2.css">
  <link rel="stylesheet" href="desktop-v2.css">
</head>
<body>
  <section class="mobile-shell">
    <main class="mobile-main">
      <header class="mobile-titlebar">
        <h1>雲端書籤</h1>
        <div class="mobile-tools">
          <button class="plain-icon" type="button" data-focus-search aria-label="搜尋">⌕</button>
          <button class="plain-icon" type="button" data-mobile-menu aria-label="更多">⋮</button>
        </div>
      </header>

      <label class="search"><span>⌕</span><input id="mobileSearch" autocomplete="off" placeholder="搜尋書籤…"></label>

      <section id="mobileSearchResults" class="hidden"></section>
      <section id="mobileBrowse">
        <div class="section-heading"><span class="favorite-mark">★</span><span>我的最愛</span></div>
        <div id="favoriteRail" class="favorite-rail"></div>

        <div class="section-heading folder-heading">
          <span>資料夾</span>
          <button class="text-btn" type="button" data-new-folder>＋</button>
        </div>
        <div id="mobileFolders"></div>
      </section>
    </main>
    <button class="fab" type="button" data-add aria-label="新增書籤">＋</button>
  </section>

  <section class="desktop-shell">
    <aside class="sidebar">
      <h1>雲端書籤</h1>
      <label class="search sidebar-search"><span>⌕</span><input id="desktopSearch" autocomplete="off" placeholder="搜尋書籤…"></label>
      <nav id="desktopNav" class="sidebar-nav"></nav>

      <div class="sidebar-label"><span>資料夾</span><button class="text-btn" type="button" data-new-folder>＋</button></div>
      <nav id="desktopFolders" class="sidebar-folders"></nav>

      <div class="sidebar-spacer"></div>
      <button class="nav-item tools-entry" type="button" data-tools-menu><span>⇅</span><span class="nav-name">匯入 / 匯出</span><span></span></button>
    </aside>

    <main class="desktop-main">
      <header class="desktop-topbar">
        <div><h2 id="desktopTitle">全部書籤</h2><small id="desktopCount">0 個書籤</small></div>
        <span class="desktop-spacer"></span>
        <div class="segmented"><button type="button" data-layout="list">☰</button><button type="button" data-layout="grid" class="active">▦</button></div>
        <button class="primary-btn" type="button" data-add>＋ 新增書籤</button>
      </header>
      <section id="desktopContent" class="desktop-content"></section>
    </main>
  </section>

  <div id="backdrop" class="backdrop hidden"></div>

  <section id="bookmarkSheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip"></div>
    <div class="sheet-head"><h2 id="sheetTitle">新增書籤</h2><button class="text-btn muted" type="button" data-close-sheet>取消</button></div>
    <input id="bookmarkId" type="hidden">
    <label class="field"><span>網址</span><input id="bookmarkUrl" type="url" placeholder="https://"></label>
    <label class="field"><span>標題</span><input id="bookmarkName" placeholder="自動抓取標題"></label>
    <label class="field"><span>資料夾</span><select id="bookmarkFolder"></select></label>
    <div class="favorite-toggle-row"><span>加入我的最愛</span><button id="bookmarkFavorite" class="switch" type="button" aria-pressed="false"></button></div>
    <button id="saveBookmark" class="primary-btn sheet-save" type="button">儲存</button>
  </section>

  <section id="themePanel" class="theme-panel hidden" role="dialog" aria-modal="true">
    <div class="sheet-head"><div><h2>配色主題</h2><p>選擇配色與明暗模式。</p></div><button class="text-btn muted" type="button" data-close-theme>完成</button></div>
    <div id="themeModes" class="theme-modes"></div>
    <div id="paletteGrid" class="palette-grid"></div>
  </section>

  <div id="contextMenu" class="context-menu hidden"></div>
  <div id="mobileOverflow" class="context-menu hidden"></div>
  <input id="importFile" class="hidden" type="file" accept="application/json,.json">

  <script src="state-v2.js"></script>
  <script src="render-mobile-v2.js"></script>
  <script src="render-desktop-v2.js"></script>
  <script src="actions-bookmark-v2.js"></script>
  <script src="actions-tools-v2.js"></script>
  <script src="init-v2.js"></script>
</body>
</html>

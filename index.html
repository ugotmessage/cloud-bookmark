<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一個簡單且現代化的書籤管理系統，支援新增、分類、匯出及匯入書籤等功能。">
  <title>書籤</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <!-- 添加 Google Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="header-content">
      <div class="logo">
        <span class="material-icons">bookmarks</span>
      </div>
      <div class="search-container">
        <div class="search-box">
          <span class="material-icons search-icon">search</span>
          <input type="text" id="searchInput" placeholder="搜尋您的書籤...">
        </div>
      </div>
    </div>
  </header>
  <main class="main-content">
    <form id="addBookmarkForm" class="bookmark-form">
      <input type="text" id="bookmarkName" placeholder="書籤名稱" required>
      <input type="url" id="bookmarkURL" placeholder="書籤網址" required>
      <select id="folderSelect">
        <option value="">未分類</option>
      </select>
      <button type="submit" class="btn btn-primary">
        <span class="material-icons">add</span>新增書籤
      </button>
    </form>
    <button id="addFolder" class="btn btn-primary">
      <span class="material-icons">create_new_folder</span>新增資料夾
    </button>
    <div id="bookmarks" class="bookmark-list"></div>
    <div class="action-buttons">
      <button id="exportData" class="btn btn-secondary">
        <span class="material-icons">file_download</span>匯出書籤
      </button>
      <label class="btn btn-secondary import-label">
        <span class="material-icons">file_upload</span>匯入書籤
        <input type="file" id="importData" hidden>
      </label>
    </div>
  </main>

  <!-- 模態視窗 -->
  <div id="folderModal" class="modal hidden">
    <div class="modal-content">
      <h2><span class="material-icons">create_new_folder</span>新增資料夾</h2>
      <input type="text" id="folderNameInput" placeholder="資料夾名稱">
      <button id="submitFolderButton" class="btn btn-primary">確定</button>
      <button id="closeFolderModal" class="btn btn-secondary">取消</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="search.js"></script>
</body>
</html>
